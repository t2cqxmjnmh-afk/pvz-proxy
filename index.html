<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #ffffff;
            color: #333333;
            margin: 0;
        }
        h1 { margin-bottom: 30px; font-weight: 300; }
        button { 
            padding: 20px 40px; 
            font-size: 20px; 
            cursor: pointer; 
            background: #202020;
            border: 2px solid #333; 
            border-radius: 8px; 
            color: white; 
            transition: 0.3s;
        }
        button:hover { 
            background: #ffffff; 
            color: #202020;
            border: 2px solid #202020;
        }
    </style>
</head>
<body>

    <h1>Proxy Gateway</h1>
    <button onclick="window.location.href='/api/ask'">Connect to Server</button>

</body>
</html>
